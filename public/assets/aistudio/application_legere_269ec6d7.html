<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour de Provence 2024 – le prologue de Mads Pedersen</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2330;--mute:#5d6678;--accent:#d9482b;--line:#d8d4ca;--track:#8b8f99;--sea:#cfe6f2;--land:#ebe6d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b212b;--ink:#eceff4;--mute:#a0a9ba;--accent:#ff7a5c;--line:#323a48;--track:#4a5262;--sea:#17323f;--land:#262b34}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1b212b;--ink:#eceff4;--mute:#a0a9ba;--accent:#ff7a5c;--line:#323a48;--track:#4a5262;--sea:#17323f;--land:#262b34}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 14px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:1rem;margin:0 0 8px}
canvas{display:block}
.fit{width:100%}
#map{max-width:720px;margin:0 auto}
.scroll{overflow-x:auto}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
button,select{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
input[type=range]{flex:1;min-width:140px}
.read{display:flex;gap:8px;margin-top:8px}
.read div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.read b{display:block;font-size:1.15rem}
.read span{color:var(--mute);font-size:.8rem}
</style>
</head>
<body>
<main>
<h1>Prologue du Tour de Provence 2024</h1>
<p class="sub">Mads Pedersen sur la Corniche Kennedy, Marseille.</p>

<div class="card">
  <h2>Le départ</h2>
  <canvas id="road" class="fit"></canvas>
  <div class="read"><div><b id="st">0 s</b><span>durée écoulée</span></div><div><b id="sd">0 m</b><span>distance parcourue</span></div></div>
  <div class="ctrl">
    <button id="sPlay">⏸ Pause</button><button id="sReset">↺ Recommencer</button>
    <select id="sRate" aria-label="Vitesse de l’animation"><option value="0.5">× 0,5</option><option value="1" selected>× 1</option><option value="2">× 2</option></select>
    <input id="sScrub" type="range" min="0" max="16" step="0.05" value="0" aria-label="Temps">
  </div>
</div>

<div class="card">
  <h2>Chronophotographie du départ</h2>
  <canvas id="strip" class="fit"></canvas>
</div>

<div class="card">
  <h2>Le trajet sur la carte du parcours</h2>
  <canvas id="map" class="fit"></canvas>
  <div class="read"><div><b id="rt">0 s</b><span>durée écoulée</span></div><div><b id="rd">0 m</b><span>distance parcourue</span></div></div>
  <div class="ctrl">
    <button id="rPlay">⏸ Pause</button><button id="rReset">↺ Recommencer</button>
    <select id="rRate" aria-label="Accélération du temps"><option value="10">× 10</option><option value="20" selected>× 20</option><option value="40">× 40</option></select>
    <input id="rScrub" type="range" min="0" max="319" step="1" value="0" aria-label="Temps">
  </div>
  <p style="color:var(--mute);font-size:.8rem;margin:6px 0 0">Le temps est accéléré pour suivre toute la course.</p>
</div>
</main>

<script>
const D=5000, TT=319, T=8, VMAX=D/(TT-T/2), A=VMAX/T, TS=16;
const pos=t=>t<=T?0.5*A*t*t:0.5*A*T*T+VMAX*(t-T);
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fr=(n,d=1)=>n.toFixed(d).replace('.',',');
function fit(c,h){const r=window.devicePixelRatio||1,w=c.clientWidth;c.width=w*r;c.height=h*r;c.style.height=h+'px';const x=c.getContext('2d');x.setTransform(r,0,0,r,0,0);return [x,w];}

function mkClock(o){
  const c={t:0,playing:true,last:0,rate:o.rate,raf:0};
  function frame(ts){
    if(!c.playing)return;
    const dt=Math.min((ts-c.last)/1000,0.05);c.last=ts;
    c.t=Math.min(o.max,c.t+dt*c.rate);o.draw();
    if(c.t>=o.max){c.playing=false;o.play.textContent='▶ Rejouer';return;}
    c.raf=requestAnimationFrame(frame);
  }
  c.start=()=>{cancelAnimationFrame(c.raf);c.last=performance.now();c.raf=requestAnimationFrame(frame);};
  o.play.onclick=()=>{if(c.t>=o.max)c.t=0;c.playing=!c.playing;o.play.textContent=c.playing?'⏸ Pause':'▶ Lecture';if(c.playing)c.start();};
  o.reset.onclick=()=>{c.t=0;c.playing=true;o.play.textContent='⏸ Pause';o.draw();c.start();};
  o.rateSel.onchange=e=>c.rate=+e.target.value;
  o.scrub.oninput=e=>{c.playing=false;o.play.textContent='▶ Lecture';c.t=+e.target.value;o.draw();};
  return c;
}

/* ---------- Le départ ---------- */
function drawRoad(){
  const t=S.t,[x,w]=fit($('road'),170),pL=18,sx=m=>pL+(w-36)*m/200;
  x.fillStyle=css('--track');x.fillRect(0,95,w,45);
  x.setLineDash([10,8]);x.strokeStyle=css('--card');x.lineWidth=2;x.beginPath();x.moveTo(0,118);x.lineTo(w,118);x.stroke();x.setLineDash([]);
  x.fillStyle=css('--mute');x.font='11px system-ui';x.textAlign='center';
  for(let m=0;m<=200;m+=20){x.fillText(m,sx(m),157);x.fillRect(sx(m)-0.5,140,1,5);}
  x.fillText('distance depuis le départ (m)',w/2,168);
  x.font='30px serif';x.save();x.translate(sx(pos(t)),0);x.scale(-1,1);x.fillText('🚴',0,93);x.restore();
  $('st').textContent=fr(t)+' s';$('sd').textContent=fr(pos(t))+' m';$('sScrub').value=t;
}
function drawStrip(){
  const [x,Wd]=fit($('strip'),150),PX=(Wd-40)/200,em=Math.round(Math.max(16,Math.min(30,Wd/32)));
  
  
  const sx=m=>20+m*PX;
  x.strokeStyle=x.fillStyle=css('--mute');x.lineWidth=1;x.font='11px system-ui';x.textAlign='center';
  x.beginPath();x.moveTo(sx(0),104);x.lineTo(sx(200),104);x.stroke();
  for(let m=0;m<=200;m+=5){const L=m%20===0?10:m%10===0?7:4;x.beginPath();x.moveTo(sx(m),104);x.lineTo(sx(m),104+L);x.stroke();if(m%20===0)x.fillText(m+' m',sx(m),130);}
  let lastLab=-99;for(let k=0;k<=8;k++){
    const p=sx(pos(k*2));
    x.strokeStyle=css('--line');x.setLineDash([3,3]);x.beginPath();x.moveTo(p,78);x.lineTo(p,104);x.stroke();x.setLineDash([]);
    x.font=em+'px serif';x.save();x.translate(p,0);x.scale(-1,1);x.fillText('🚴',0,76);x.restore();
    if(p-lastLab>26){x.font='11px system-ui';x.fillStyle=css('--ink');x.fillText(k*2+' s',p,42);lastLab=p;}
  }
  
}
const S=mkClock({max:TS,rate:1,play:$('sPlay'),reset:$('sReset'),rateSel:$('sRate'),scrub:$('sScrub'),draw:()=>{drawRoad();drawStrip();}});

const cum=[0];for(let i=1;i<PATH.length;i++)cum.push(cum[i-1]+Math.hypot(PATH[i][0]-PATH[i-1][0],PATH[i][1]-PATH[i-1][1]));
const TOT=cum[cum.length-1];
function at(f){
  const d=f*TOT;let i=1;while(i<cum.length-1&&cum[i]<d)i++;
  const a=(d-cum[i-1])/((cum[i]-cum[i-1])||1);
  return [i,PATH[i-1][0]+(PATH[i][0]-PATH[i-1][0])*a,PATH[i-1][1]+(PATH[i][1]-PATH[i-1][1])*a];
}
function drawMap(){
  if(!IMG.complete||!IMG.naturalWidth)return;
  const u=R.t,d=Math.min(D,pos(u)),cv=$('map'),h=Math.round(cv.clientWidth*MAPAR);
  const [x,w]=fit(cv,h),P=p=>[p[0]*w,p[1]*h];
  x.drawImage(IMG,0,0,w,h);
  const [i,cx,cy]=at(d/D),e=P([cx,cy]);
  const trail=()=>{x.beginPath();for(let k=0;k<i;k++){const q=P(PATH[k]);k?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]);}x.lineTo(e[0],e[1]);};
  x.lineCap='round';x.lineJoin='round';
  x.strokeStyle='#fff';x.lineWidth=Math.max(6,w*.008);trail();x.stroke();
  x.strokeStyle='#0b5fff';x.lineWidth=Math.max(3.5,w*.0048);trail();x.stroke();
  x.fillStyle='#ffd400';x.strokeStyle='#111';x.lineWidth=2;x.beginPath();x.arc(e[0],e[1],Math.max(6,w*.008),0,7);x.fill();x.stroke();
  $('rt').textContent=Math.round(u)+' s';$('rd').textContent=Math.round(d).toLocaleString('fr-FR')+' m';$('rScrub').value=u;
}
const R=mkClock({max:TT,rate:20,play:$('rPlay'),reset:$('rReset'),rateSel:$('rRate'),scrub:$('rScrub'),draw:drawMap});

window.addEventListener('resize',()=>{S.t+=0;drawRoad();drawStrip();drawMap();});
